# Reverse proxy AMP Appro — a copier dans /etc/nginx/conf.d/amp-appro.conf
# Remplacer appro.exemple.bf par le vrai domaine (setup-vps.sh le fait automatiquement).
# Certbot (--nginx) ajoutera ensuite le bloc HTTPS 443 et la redirection HTTP -> HTTPS.

limit_req_zone $binary_remote_addr zone=amp_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=amp_api:10m rate=10r/s;
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name appro.exemple.bf;

    server_tokens off;
    # Pieces jointes : 5 Mo encodes en base64 dans du JSON (limite serveur 8 Mo)
    client_max_body_size 8m;
    client_body_timeout 30s;
    client_header_timeout 15s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = /login {
        limit_req zone=amp_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/amp-appro-proxy.conf;
    }

    location / {
        limit_req zone=amp_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/amp-appro-proxy.conf;
    }
}
