name: amp-appro-pilot
services:
  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AMP_HOST: "0.0.0.0"
      AMP_PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - amp_data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  amp_data:
